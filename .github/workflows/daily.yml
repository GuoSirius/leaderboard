name: 每日A股情绪日报

# 触发：
#   1) 定时：工作日 18:00 北京时间 = 10:00 UTC
#   2) 手动：在 Actions 页面点 "Run workflow"
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # 用于将生成的 HTML 提交回仓库

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 生成日报
        # 说明：本流水线依赖 通达信 TCP(7709, mootdx) 拉全市场行情、
        # 以及东方财富/同花顺/新浪/腾讯 的 HTTP 接口。
        # GitHub Runner 通常能访问公网 HTTP，但「通达信 TCP」在海外 Runner
        # 上可能不可达；若全市场广度/北交所部分缺失，龙虎榜+题材+行业
        # （均为 HTTP 源）仍会正常生成。如需完整报告请在本地运行。
        run: python run_daily.py

      - name: 上传 HTML 产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aks-report
          path: output/*.html
          if-no-files-found: warn

      - name: 提交回仓库
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f output/*.html
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "chore: 自动生成日报 $(date +%F)"
            git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${GITHUB_REF_NAME}
          fi
